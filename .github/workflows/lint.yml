name: lint
on:
  push:
    branches: [main]
  pull_request:

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile.claude

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: .

  hooks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hooks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # black and clang-format come from apt, as they do in the image, so the
      # commit guard and CI agree on formatting.
      - run: sudo apt-get update && sudo apt-get install -y black clang-format
      - run: pip install pytest pytest-xdist pytest-cov pylint
      - run: black --check .
      - run: pylint ./*.py
      - run: pytest -n auto --cov=min_comments --cov=format_check --cov-fail-under=85
